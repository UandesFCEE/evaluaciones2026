<script>

const PA_URL = "https://defaultb91e1a9b47184623882e6fb655d96b.f0.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/6001f308890547c3ba91016527120c1f/triggers/manual/paths/invoke?api-version=1";

let selectedCourse = "";
let selectedProf = "";
let necesitaImpresion = null;
let ayudantesActuales = [];
let registrosSesion = [];

function onCursoChange(){

  const cursoIndex = document.getElementById("sel-curso").value;

  if(cursoIndex === ""){
    return;
  }

  selectedCourse = CURSOS[cursoIndex];

  const profesores = Object.keys(DATA[selectedCourse] || {});

  const selProf = document.getElementById("sel-prof");

  selProf.innerHTML = `<option value="">— Seleccione un profesor —</option>`;

  profesores.forEach(prof => {

    selProf.innerHTML += `<option value="${prof}">${prof}</option>`;

  });

  selProf.disabled = false;

  document.getElementById("impresion-card").style.display = "none";
  document.getElementById("ayudantes-card").style.display = "none";

}

function onProfChange(){

  selectedProf = document.getElementById("sel-prof").value;

  if(selectedProf === ""){
    return;
  }

  document.getElementById("impresion-card").style.display = "block";

  document.getElementById("step1").classList.remove("active");
  document.getElementById("step1").classList.add("done");

  document.getElementById("step2").classList.add("active");

}

function marcarImpresion(valor){

  necesitaImpresion = valor === "si";

  document.getElementById("imp-si").classList.remove("active");
  document.getElementById("imp-no").classList.remove("active");

  if(valor === "si"){
    document.getElementById("imp-si").classList.add("active");
  } else {
    document.getElementById("imp-no").classList.add("active");
  }

  document.getElementById("btn-siguiente").disabled = false;

}

function mostrarAyudantes(){

  ayudantesActuales = JSON.parse(JSON.stringify(DATA[selectedCourse][selectedProf]));

  ayudantesActuales.forEach(a => {
    a.respuesta = null;
  });

  renderAyudantes();

  document.getElementById("ayudantes-card").style.display = "block";

  document.getElementById("step2").classList.remove("active");
  document.getElementById("step2").classList.add("done");

  document.getElementById("step3").classList.add("active");

}

function renderAyudantes(){

  const cont = document.getElementById("ayudantes-list");

  cont.innerHTML = "";

  ayudantesActuales.forEach((a, i) => {

    let clase = "";

    if(a.respuesta === "si"){
      clase = "answered-si";
    }

    if(a.respuesta === "no"){
      clase = "answered-no";
    }

    cont.innerHTML += `
      <div class="ayudante-row ${clase}">
        <div class="ayudante-info">
          <div class="ayudante-nombre">
            ${a.nombre}
            ${a.coordinador ? '<span class="coord-badge">COORD.</span>' : ''}
          </div>
          <div class="ayudante-email">${a.correo}</div>
        </div>

        <div class="toggle-group">

          <button class="toggle-btn si ${a.respuesta === "si" ? "active" : ""}"
            onclick="setRespuesta(${i}, 'si')">
            Sí
          </button>

          <button class="toggle-btn no ${a.respuesta === "no" ? "active" : ""}"
            onclick="setRespuesta(${i}, 'no')">
            No
          </button>

        </div>
      </div>
    `;

  });

  updateProgress();

}

function setRespuesta(index, valor){

  ayudantesActuales[index].respuesta = valor;

  renderAyudantes();

}

function updateProgress(){

  const total = ayudantesActuales.length;

  const respondidos = ayudantesActuales.filter(a => a.respuesta !== null).length;

  const pct = total === 0 ? 0 : Math.round((respondidos / total) * 100);

  document.getElementById("prog-text").innerText =
    `${respondidos} de ${total} respondidos`;

  document.getElementById("prog-pct").innerText =
    `${pct}%`;

  document.getElementById("prog-fill").style.width =
    `${pct}%`;

  document.getElementById("btn-confirmar").disabled =
    respondidos !== total;

}

function agregarOtro(){

  const div = document.createElement("div");

  div.className = "otro-row";

  div.innerHTML = `
    <input type="text"
      class="otro-input"
      placeholder="Nombre de la persona">

    <button class="otro-remove"
      onclick="this.parentElement.remove()">
      ×
    </button>
  `;

  document.getElementById("otros-list").appendChild(div);

}

async function confirmar(){

  const cuidan = [];
  const noCuidan = [];
  const otros = [];

  ayudantesActuales.forEach(a => {

    if(a.respuesta === "si"){
      cuidan.push(a);
    } else {
      noCuidan.push(a);
    }

  });

  document.querySelectorAll(".otro-input").forEach(input => {

    if(input.value.trim() !== ""){

      otros.push({
        nombre: input.value.trim()
      });

    }

  });

  const filas = [];

  cuidan.forEach(a => {

    filas.push({
      curso: selectedCourse,
      profesor: selectedProf,
      ayudante: a.nombre,
      correo: a.correo || "",
      coordinador: a.coordinador ? "Sí" : "No",
      cuida_prueba: "Sí",
      requiere_impresion: necesitaImpresion ? "Sí" : "No",
      fecha: new Date().toLocaleString("es-CL")
    });

  });

  noCuidan.forEach(a => {

    filas.push({
      curso: selectedCourse,
      profesor: selectedProf,
      ayudante: a.nombre,
      correo: a.correo || "",
      coordinador: a.coordinador ? "Sí" : "No",
      cuida_prueba: "No",
      requiere_impresion: necesitaImpresion ? "Sí" : "No",
      fecha: new Date().toLocaleString("es-CL")
    });

  });

  otros.forEach(a => {

    filas.push({
      curso: selectedCourse,
      profesor: selectedProf,
      ayudante: a.nombre,
      correo: "",
      coordinador: "No",
      cuida_prueba: "Sí",
      requiere_impresion: necesitaImpresion ? "Sí" : "No",
      fecha: new Date().toLocaleString("es-CL")
    });

  });

  for(let i = 0; i < filas.length; i++){

    try {

      await fetch(PA_URL, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify(filas[i])

      });

    } catch(error){

      console.error("Error Power Automate", error);

    }

  }

  registrosSesion.push(...filas);

  document.getElementById("session-count").innerText =
    registrosSesion.length;

  document.getElementById("form-section").style.display = "none";

  document.getElementById("summary").classList.add("visible");

  document.getElementById("step1").classList.remove("active");
  document.getElementById("step2").classList.remove("active");
  document.getElementById("step3").classList.remove("active");

  document.getElementById("step1").classList.add("done");
  document.getElementById("step2").classList.add("done");
  document.getElementById("step3").classList.add("done");

  document.getElementById("step4").classList.add("active");

  document.getElementById("sum-meta-header").innerText =
    `${selectedCourse} · ${selectedProf}`;

  document.getElementById("sum-meta").innerHTML = `
    <span>Curso:</span> ${selectedCourse}<br>
    <span>Profesor:</span> ${selectedProf}
  `;

  document.getElementById("sum-impresion").innerHTML = `
    <div class="summary-pill ${necesitaImpresion ? "imp-si" : "imp-no"}">
      ${necesitaImpresion ? "Sí requiere impresión" : "No requiere impresión"}
    </div>
  `;

  document.getElementById("sum-si").innerHTML =
    cuidan.map(a =>
      `<div class="summary-pill si">${a.nombre}</div>`
    ).join("");

  document.getElementById("sum-no").innerHTML =
    noCuidan.map(a =>
      `<div class="summary-pill no">${a.nombre}</div>`
    ).join("");

  if(otros.length > 0){

    document.getElementById("sum-otros-title").style.display = "block";

    document.getElementById("sum-otros").innerHTML =
      otros.map(a =>
        `<div class="summary-pill otro">${a.nombre}</div>`
      ).join("");

  }

}

function reiniciar(){

  location.reload();

}

function exportarTexto(){

  let texto = `
Curso: ${selectedCourse}
Profesor: ${selectedProf}

Impresión:
${necesitaImpresion ? "Sí" : "No"}

`;

  ayudantesActuales.forEach(a => {

    texto += `${a.nombre}: ${a.respuesta}\n`;

  });

  navigator.clipboard.writeText(texto);

  alert("Resumen copiado");

}

function descargarExcel(){

  const ws = XLSX.utils.json_to_sheet(registrosSesion);

  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, ws, "Registros");

  XLSX.writeFile(wb, "Semana_Pruebas.xlsx");

}

</script>
